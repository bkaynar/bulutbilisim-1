name: Build and Push to Azure Container Registry (ACR)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-to-acr:
    runs-on: ubuntu-latest
    # Yalnızca ACR secret'ları tanımlıysa çalıştır
    if: ${{ secrets.ACR_NAME != '' && secrets.ACR_PASSWORD != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push to ACR (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/mini-drive:v1
